apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  labels:
    app: my-web-app
    tier: frontend
data:
  default.conf: |
    upstream backend {
      server backend-service:5000;
    }

    server {
      listen 80;

      location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
      }

      location /api {
        proxy_pass http://backend;
      }

      location /health {
        proxy_pass http://backend/health;
      }
    }
